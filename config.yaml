# Prop-Firm Signal Bot Configuration
# ====================================
# This bot runs in SIGNAL-ONLY mode — no MetaTrader5 connection required.
# Signals are delivered via Telegram + rich terminal dashboard.
# Data is sourced from TwelveData API (https://twelvedata.com).

system:
  magic_number: 123456
  log_level: "INFO"
  symbol_list: ["XAUUSD"]
  timeframe: "M15"
  # Session filter: restricted to high-win-rate windows (avoids 05:00-09:00 UTC chop & 17:00 NY open spike)
  active_sessions:
    - { name: "London",            start_utc: 8,  end_utc: 12 }
    - { name: "London/NY Overlap", start_utc: 12, end_utc: 17 }
    - { name: "New York",          start_utc: 18, end_utc: 22 }  # Skip 17:00 NY open spike (28.6% WR)
    - { name: "Late NY / Asia",    start_utc: 22, end_utc: 24 }

# ── Virtual Paper Account ────────────────────────────────────────────────────
# Used for risk calculations (lot size recommendations, drawdown tracking).
# No real money is at risk — this is signal-only.
virtual_account:
  # NOTE: Changing this value re-bases the persisted drawdown baseline and
  # high-water-mark on next start. At $1,000, the 1% risk-per-trade budget
  # cannot be expressed in 0.01-lot increments for wide DAY/SWING stops, so
  # signals are emitted with Lot 0.0. Keep this aligned with the account the
  # risk profile was tuned for.
  balance: 10000.0         # Simulated account balance in USD
  currency: "USD"

# ── TwelveData API ───────────────────────────────────────────────────────────
data_source:
  provider: "twelvedata"
  cache_seconds: 60
  timeframe_cache_seconds:
    D1: 14400               # 4 hours (D1 trend is ultra stable — only 4 calls/day)
    H4: 3600                # 1 hour (4-hour candle changes 6 times/day)
    H1: 600                 # 10 minutes (6 calls/hr)
    M15: 90                 # 1.5 minutes (fast real-time scalp updates)
    M5: 60                  # 1 minute (eliminates alert delay right after candle close)
  max_stale_seconds: 600    # Fail closed after 10 minutes of stale market data
  min_request_gap_seconds: 8
  requests_per_minute: 8
  daily_request_limit: 800
  retry:
    max_attempts: 3
    base_delay_seconds: 2
    max_delay_seconds: 30
    jitter_seconds: 1
    connect_timeout_seconds: 5
    read_timeout_seconds: 45
  # TwelveData free tier: 800 calls/day, 8 req/min
  # Paid plans available at https://twelvedata.com/pricing

# ── Risk Management ──────────────────────────────────────────────────────────
risk:
  account_equity_risk_pct: 1.0     # % of virtual balance risked per signal
  max_daily_loss_pct: 5.0          # Pause signalling if daily DD hits this
  max_overall_drawdown_pct: 10.0   # Pause signalling if overall DD hits this
  profit_target_daily_pct: 50.0    # Stop signalling once daily target is hit
  max_spread_points: 15
  spread_limit_map:
    XAUUSD: 30
  martingale_multiplier: 1.0       # 1.0 = No Martingale
  max_lot_size: 5.0

  # Breakeven Alert (One-Time Alert at +250 pips)
  breakeven_enabled: true
  breakeven_activation_pips: 250        # Alert to move SL to entry at +250 pips ($10.00 on Gold)
  trailing_stop_enabled: false          # Disabled — only initial signal and one-time breakeven alert
  friday_exit_hour: 21
  sunday_open_hour: 21                  # Market reopens Sunday at 21:00 UTC
  min_trade_duration_seconds: 240
  pending_order_expiry_hours: 4

  # Post-Loss Cooldown Guard (prevents rapid consecutive stop-outs in choppy markets)
  loss_cooldown_minutes: 45             # Pause new signals on a symbol for 45 mins after a stop-out
  post_trigger_grace_bars: 1            # 1-bar grace period after trigger uses bar_close for SL to avoid wick spikes

  symbol_risk_map:
    XAUUSD: 1.0

# ── Strategy ─────────────────────────────────────────────────────────────────
strategy:
  ema_period_fast: 50
  ema_period_slow: 200
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  wick_threshold_ratio: 0.40           # Raised from 0.25 → tighter wick rejection filter
  liquidity_lookback: 15
  rsi_buy_threshold: 70
  rsi_sell_threshold: 30
  sma_period: 40
  atr_multiplier: 1.5
  atr_multiplier_map:
    XAUUSD: 0.5
  entry_atr_multiplier: 0.15
  atr_period: 14
  sl_buffer_map:
    XAUUSD: 0.50
    default: 0.50
  # Stop Loss calculation mode:
  # "atr" = distance from entry based on ATR (avoids giant candle-sized stops on DAY/SWING)
  # "candle_extreme" = opposite side of signal candle + buffer (legacy)
  sl_mode: "atr"
  sl_atr_multiplier: 1.5
  sl_atr_multiplier_map:
    DAY: 1.5
    SCALP: 1.5
    SCALP_M5: 1.5
    SWING: 1.5
  max_sl_pips_map:
    DAY: 200            # Cap DAY SL at 200 pips ($20.00 on Gold)
    SCALP: 100           # Cap SCALP SL at 80 pips ($8.00 on Gold, aligned with SCALP_M5)
    SCALP_M5: 80        # Cap SCALP_M5 SL at 80 pips ($8.00 on Gold)
    SWING: 350          # Cap SWING SL at 350 pips ($35.00 on Gold)
  tp_mode: "dynamic"        # Options: "structured", "dynamic", "fixed_rr"
  risk_reward_ratio: 3.0
  risk_reward_ratio_map:
    SCALP_M5: 2.0         # Nimble scalp targets (avoids unreachable 3R on M5)
    SCALP: 2.0            # M15 scalp targets
    DAY: 2.5              # H1 day trade targets
    SWING: 3.0            # H4/D1 swing targets
  max_risk_reward_ratio: 5.0
  max_risk_reward_ratio_map:
    SCALP_M5: 3.0
    SCALP: 3.0
    DAY: 4.0
    SWING: 5.0
  sweep_sl_atr_buffer: 0.3              # Structural invalidation wick + 0.3*ATR buffer
  news_blocked_times: []

  # SMC Filter (Order Block + FVG Confluence)
  smc_filter_enabled: true
  smc_min_confluence_score: 20
  smc_min_confluence_map:
    SCALP_M5: 0         # M5 operates unhindered as pure liquidity wick sweeps (+176.91 PnL)
    SCALP: 0            # M15 operates unhindered on breakout continuations (+24.71 PnL)
    DAY: 20             # H1 requires institutional OB/FVG confluence (+45.24 PnL, 50% WR)
    SWING: 0            # SWING filtered via Macro HTF ADX instead

  # ADX Range Filter — blocks CONTINUATION (breakout) signals when the market is
  # consolidating/ranging (ADX < threshold).
  adx_filter_enabled: true
  adx_min_threshold: 20     # 0-100 scale: <20 = ranging/weak, >20 = directional
  adx_period: 14
  adx_min_threshold_map:
    SCALP_M5: 25        # Raised from 20 -> filters low-momentum morning chop
    SCALP: 25           # Raised from 20 -> filters low-momentum morning chop
    DAY: 20
    SWING: 20

  # Setup Specialization per timeframe:
  # M15 specializes in trend breakouts (+24.71 to +45.74 PnL, 1.70 PF)
  # M5 captures nimble reversal sweeps (+74.68 to +91.02 PnL) and breakouts
  allowed_setups_map:
    SCALP: ["breakout"]               # M15 takes only trend breakouts (eliminates -98 point sweep losses)
    SCALP_M5: ["sweep", "breakout"]   # M5 takes both reversal sweeps and breakouts
    DAY: ["sweep", "breakout"]
    SWING: ["sweep", "breakout"]

  # Higher Timeframe (HTF) ADX Macro Filter
  # Requires the major timeframe trend to have directional strength (blocks signals during macro range)
  htf_adx_filter_enabled: true
  htf_adx_min_threshold_map:
    DAY: 35             # Requires H4 ADX >= 35 (boosts DAY PF to 3.26)
    SWING: 35           # Requires D1 ADX >= 35 (filters choppy SWING trades, boosting PF to 1.83)

  # ── Reversal-sweep direction & risk ─────────────────────────────────────────
  # Liquidity sweeps are REVERSAL setups, so they are evaluated in BOTH
  # directions and are NOT locked to the lagging SMA-40 trend. A sweep that
  # agrees with the trend lock is exhaustion and is deliberately ignored.
  #
  # sweep_allow_counter_macro:
  #   true  -> a reversal sweep may fade a conflicting D1 EMA-20 macro trend
  #            (required to catch a bottom/top before the D1 EMA rolls over).
  #   false -> the D1 macro gate still blocks counter-macro sweeps (conservative).
  sweep_allow_counter_macro: false
  # Looser R:R floor for reversal sweeps (structure targets are often nearer than
  # the 3.0R continuation floor, which would otherwise distort the target).
  sweep_min_rr: 2.0

  # Multi-Timeframe Directional Protection
  allow_opposing_trades: false     # Block opposing positions (hedging) on the same symbol across timeframes
  fail_closed_macro_gate: true     # Block setups when higher-timeframe D1 macro data is unavailable

  # Active timeframe pairs to scan (macro-to-micro hierarchy)
  # High-Win-Rate Profile: M15/H1/H4 timeframes with M5 restricted to London/NY Overlap (12:00-17:00 UTC)
  active_pairs:
    - { low: "H4", high: "D1", label: "SWING" }
    - { low: "H1", high: "H4", label: "DAY" }
    - { low: "M15", high: "H1", label: "SCALP" }
    - { low: "M5", high: "H1", label: "SCALP_M5", allowed_sessions: ["London/NY Overlap"] }

  # Session-specific ATR multipliers (applied on top of base atr_multiplier)
  # Wider SL in volatile sessions, tighter in quiet ones
  session_atr_multiplier_map:
    London: 1.2
    London/NY Overlap: 1.2
    New York: 1.0
    Late NY / Asia: 0.8
    Off-Hours: 1.0

  # Per-symbol strategy overrides
  # require_trend_alignment: both LowTF and HighTF must agree on direction
  # This prevents shorting a D1 bull trend on the SCALP/DAY pairs
  symbol_overrides:
    XAUUSD:
      require_trend_alignment: true
      allow_entry_trend_only: true    # Follow entry TF when higher TF disagrees (D1 macro gate still blocks counter-trend)
      # Protective momentum filter: refuse to BUY when RSI > rsi_buy_threshold
      # (overbought) or SELL when RSI < rsi_sell_threshold (oversold). Applied to
      # the chosen setup, so it guards reversal sweeps as well as breakouts.
      rsi_confirmation: true
      # Allow reversal sweeps to fade a conflicting D1 macro trend (bottom/top
      # catching). Set false to keep counter-macro sweeps blocked.
      sweep_allow_counter_macro: true

# ── Runtime & Health ───────────────────────────────────────────────────────────
runtime:
  state_db_path: "runtime_state.db"
  trades_csv_path: "trades.csv"
  scan_interval_seconds: 30             # 30-second scan heartbeat ensures prompt signal detection after candle close

health:
  loop_stale_seconds: 120
  data_stale_seconds: 900
  failure_threshold: 3

# ── Telegram ─────────────────────────────────────────────────────────────────
telegram:
  enabled: true
  enable_reports: false     # Periodic performance reports
  report_interval_hours: 4
  chat_id: ""               # Main alert channel/chat ID (also loadable from TELEGRAM_CHAT_ID in .env)
  admin_chat_id: ""         # Optional personal user ID for private /status commands (also TELEGRAM_ADMIN_CHAT_ID)
  token: ""                 # Also loadable from TELEGRAM_TOKEN in .env
  retry:
    max_attempts: 2
    base_delay_seconds: 1
    max_delay_seconds: 5
    jitter_seconds: 0.5
    connect_timeout_seconds: 3
    read_timeout_seconds: 8
