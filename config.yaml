# Prop-Firm Signal Bot Configuration
# ====================================
# This bot runs in SIGNAL-ONLY mode — no MetaTrader5 connection required.
# Signals are delivered via Telegram + rich terminal dashboard.
# Data is sourced from TwelveData API (https://twelvedata.com).

system:
  magic_number: 123456
  log_level: "INFO"
  symbol_list: ["XAUUSD"]
  timeframe: "M15"
  # Session filter: only generate signals during these UTC hour ranges.
  # Set to [] to scan 24/7
  active_sessions:
    - { name: "London",            start_utc: 8,  end_utc: 12 }
    - { name: "London/NY Overlap", start_utc: 12, end_utc: 17 }
    - { name: "New York",          start_utc: 17, end_utc: 21 }

# ── Virtual Paper Account ────────────────────────────────────────────────────
# Used for risk calculations (lot size recommendations, drawdown tracking).
# No real money is at risk — this is signal-only.
virtual_account:
  balance: 1000.0          # Simulated account balance in USD
  currency: "USD"

# ── TwelveData API ───────────────────────────────────────────────────────────
data_source:
  provider: "twelvedata"
  api_key: ""               # Also loadable from TWELVEDATA_API_KEY in .env
  cache_seconds: 300        # 5-min cache: 624 API calls/day (safely under 800 limit)
  # TwelveData free tier: 800 calls/day, 8 req/min
  # Paid plans available at https://twelvedata.com/pricing

# ── Risk Management ──────────────────────────────────────────────────────────
risk:
  account_equity_risk_pct: 1.0     # % of virtual balance risked per signal
  max_daily_loss_pct: 5.0          # Pause signalling if daily DD hits this
  max_overall_drawdown_pct: 10.0   # Pause signalling if overall DD hits this
  profit_target_daily_pct: 5.0     # Stop signalling once daily target is hit
  max_spread_points: 15
  spread_limit_map:
    US30: 200
    NAS100: 200
    XAUUSD: 30
  martingale_multiplier: 1.0       # 1.0 = No Martingale
  max_lot_size: 5.0

  # Trailing Stop & Breakeven Alerts
  trailing_stop_enabled: true
  trailing_stop_activation_pips: 100    # $10.00 move on Gold before trailing activates (100 pips)
  trailing_stop_distance_pips: 40       # Trail SL $4.00 behind price (40 pips)
  friday_exit_hour: 21
  min_trade_duration_seconds: 240
  pending_order_expiry_hours: 4

  symbol_risk_map:
    XAUUSD: 1.0

# ── Strategy ─────────────────────────────────────────────────────────────────
strategy:
  ema_period_fast: 50
  ema_period_slow: 200
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  wick_threshold_ratio: 0.25
  liquidity_lookback: 15
  rsi_buy_threshold: 70
  rsi_sell_threshold: 30
  sma_period: 40
  atr_multiplier: 1.5
  atr_multiplier_map:
    XAUUSD: 0.5
  entry_atr_multiplier: 0.1
  atr_period: 14
  sl_buffer_map:
    XAUUSD: 0.50
    US30: 5.0
    USTECH100: 5.0
    default: 0.50
  tp_mode: "dynamic"        # Options: "structured", "dynamic", "fixed_rr"
  risk_reward_ratio: 3.0
  news_blocked_times: []

  # SMC Filter (Order Block + FVG Confluence)
  smc_filter_enabled: false
  smc_min_confluence_score: 20

  # Active timeframe pairs to scan
  active_pairs:
    - { low: "H4", high: "D1", label: "SWING" }
    - { low: "H1", high: "H4", label: "DAY" }
    - { low: "M15", high: "H1", label: "SCALP" }

  # Per-symbol strategy overrides
  symbol_overrides: {}

# ── Telegram ─────────────────────────────────────────────────────────────────
telegram:
  enabled: true
  enable_reports: false     # Periodic performance reports
  report_interval_hours: 4
  chat_id: ""               # Also loadable from TELEGRAM_CHAT_ID in .env
  token: ""                 # Also loadable from TELEGRAM_TOKEN in .env
