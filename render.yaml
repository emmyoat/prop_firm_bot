services:
  - type: worker
    name: prop-firm-signal-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: starter
    autoDeploy: true
    disk:
      name: bot-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: STATE_DB_PATH
        value: /data/runtime_state.db
