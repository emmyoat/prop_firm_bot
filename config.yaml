# Prop-Firm Signal Bot Configuration
# ====================================
# This bot runs in SIGNAL-ONLY mode — no MetaTrader5 connection required.
# Signals are delivered via Telegram + rich terminal dashboard.
# Data is sourced from TwelveData API (https://twelvedata.com).

system:
  magic_number: 123456
  log_level: "INFO"
  symbol_list: ["XAUUSD"]
  timeframe: "M15"
  # Session filter: restricted to high-win-rate windows (avoids 05:00-09:00 UTC chop & 17:00 NY open spike)
  active_sessions:
    - { name: "London",            start_utc: 8,  end_utc: 12 }
    - { name: "London/NY Overlap", start_utc: 12, end_utc: 17 }
    - { name: "New York",          start_utc: 18, end_utc: 22 }  # Skip 17:00 NY open spike (28.6% WR)
    - { name: "Late NY / Asia",    start_utc: 22, end_utc: 24 }

# ── Virtual Paper Account ────────────────────────────────────────────────────
# Used for risk calculations (lot size recommendations, drawdown tracking).
# No real money is at risk — this is signal-only.
virtual_account:
  balance: 1000.0          # Simulated account balance in USD
  currency: "USD"

# ── TwelveData API ───────────────────────────────────────────────────────────
data_source:
  provider: "twelvedata"
  cache_seconds: 60
  timeframe_cache_seconds:
    D1: 14400               # 4 hours (D1 trend is ultra stable — only 4 calls/day)
    H4: 3600                # 1 hour (4-hour candle changes 6 times/day)
    H1: 600                 # 10 minutes (6 calls/hr)
    M15: 180                # 3 minutes (fast real-time scalp updates)
    M5: 120                 # 2 minutes (keeps M5 fresh while staying within free tier)
  max_stale_seconds: 600    # Fail closed after 10 minutes of stale market data
  min_request_gap_seconds: 8
  requests_per_minute: 8
  daily_request_limit: 800
  retry:
    max_attempts: 3
    base_delay_seconds: 2
    max_delay_seconds: 30
    jitter_seconds: 1
    connect_timeout_seconds: 5
    read_timeout_seconds: 15
  # TwelveData free tier: 800 calls/day, 8 req/min
  # Paid plans available at https://twelvedata.com/pricing

# ── Risk Management ──────────────────────────────────────────────────────────
risk:
  account_equity_risk_pct: 1.0     # % of virtual balance risked per signal
  max_daily_loss_pct: 5.0          # Pause signalling if daily DD hits this
  max_overall_drawdown_pct: 10.0   # Pause signalling if overall DD hits this
  profit_target_daily_pct: 5.0     # Stop signalling once daily target is hit
  max_spread_points: 15
  spread_limit_map:
    US30: 200
    NAS100: 200
    XAUUSD: 30
  martingale_multiplier: 1.0       # 1.0 = No Martingale
  max_lot_size: 5.0

  # Breakeven Alert (One-Time Alert at +100 pips)
  breakeven_enabled: true
  breakeven_activation_pips: 250        # Alert to move SL to entry at +100 pips ($10.00 on Gold)
  trailing_stop_enabled: false          # Disabled — only initial signal and one-time breakeven alert
  friday_exit_hour: 21
  min_trade_duration_seconds: 240
  pending_order_expiry_hours: 4

  symbol_risk_map:
    XAUUSD: 1.0

# ── Strategy ─────────────────────────────────────────────────────────────────
strategy:
  ema_period_fast: 50
  ema_period_slow: 200
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  wick_threshold_ratio: 0.40           # Raised from 0.25 → tighter wick rejection filter
  liquidity_lookback: 15
  rsi_buy_threshold: 70
  rsi_sell_threshold: 30
  sma_period: 40
  atr_multiplier: 1.5
  atr_multiplier_map:
    XAUUSD: 0.5
  entry_atr_multiplier: 0.1
  atr_period: 14
  sl_buffer_map:
    XAUUSD: 0.50
    default: 0.50
  tp_mode: "dynamic"        # Options: "structured", "dynamic", "fixed_rr"
  risk_reward_ratio: 3.0
  news_blocked_times: []

  # SMC Filter (Order Block + FVG Confluence)
  smc_filter_enabled: true
  smc_min_confluence_score: 20

  # ADX Range Filter — blocks signals when market is consolidating/ranging
  # ADX < adx_min_threshold means the market has no directional momentum -> skip signal
  adx_filter_enabled: true
  adx_min_threshold: 20     # 0-100 scale: <25 = ranging/weak, >25 = trending
  adx_period: 14

  # Active timeframe pairs to scan
  active_pairs:
    - { low: "M5", high: "H1", label: "SCALP_M5" }
    - { low: "H4", high: "D1", label: "SWING" }
    - { low: "H1", high: "H4", label: "DAY" }
    - { low: "M15", high: "H1", label: "SCALP" }

  # Session-specific ATR multipliers (applied on top of base atr_multiplier)
  # Wider SL in volatile sessions, tighter in quiet ones
  session_atr_multiplier_map:
    London: 1.2
    London/NY Overlap: 1.2
    New York: 1.0
    Late NY / Asia: 0.8
    Off-Hours: 1.0

  # Per-symbol strategy overrides
  # require_trend_alignment: both LowTF and HighTF must agree on direction
  # This prevents shorting a D1 bull trend on the SCALP/DAY pairs
  symbol_overrides:
    XAUUSD:
      require_trend_alignment: true
      allow_entry_trend_only: true    # Follow entry TF when higher TF disagrees (D1 macro gate still blocks counter-trend)
      rsi_confirmation: true          # Filter overbought buys / oversold sells

# ── Runtime & Health ───────────────────────────────────────────────────────────
runtime:
  state_db_path: "runtime_state.db"
  scan_interval_seconds: 60             # Smooth, consistent 1-minute scan heartbeat

health:
  loop_stale_seconds: 120
  data_stale_seconds: 900
  failure_threshold: 3

# ── Telegram ─────────────────────────────────────────────────────────────────
telegram:
  enabled: true
  enable_reports: false     # Periodic performance reports
  report_interval_hours: 4
  chat_id: ""               # Also loadable from TELEGRAM_CHAT_ID in .env
  token: ""                 # Also loadable from TELEGRAM_TOKEN in .env
  retry:
    max_attempts: 2
    base_delay_seconds: 1
    max_delay_seconds: 5
    jitter_seconds: 0.5
    connect_timeout_seconds: 3
    read_timeout_seconds: 8
