# Prop-Firm Compliant Trading Bot Configuration

system:
  magic_number: 123456
  log_level: "INFO"
  mt5_path: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
  dry_run: false 
  symbol_list: ["XAUUSD", "GBPUSD"]
  timeframe: "M15"  # MT5 Timeframe constant name or string
  # Session filter: only take new trades during these UTC hour ranges
  # Set to [] to trade 24/7
  active_sessions:
    - { name: "Asia", start_utc: 0, end_utc: 7 }
    - { name: "London", start_utc: 7, end_utc: 12 }
    - { name: "New York", start_utc: 12, end_utc: 17 }

risk:
  account_equity_risk_pct: 5.0
  max_daily_loss_pct: 10.0
  max_overall_drawdown_pct: 10.0
  profit_target_daily_pct: 10.0  # Optional daily target to stop trading
  max_spread_points: 15         # Default Max spread
  spread_limit_map:             # Specific limits per pair
    US30: 200                   # US30 needs wider allowance (approx 20 pips)
    USTECH100: 200
    NAS100: 200
    XAUUSD: 30                  # Gold spread allowance
    GBPUSD: 20                  # GBP/USD spread allowance
  martingale_multiplier: 1.0    # 1.0 = No Martingale (Recommended)
  
  # Advanced Management
  breakeven_activation_pips: 50   # Move SL to Entry when profit > 50 pips
  trailing_stop_activation_pips: 50 # Start trailing when profit > 50 pips
  trailing_stop_distance_pips: 25   # Distance of SL from Price (Previous: trailing_step_pips)
  trailing_update_step_pips: 20      # Only update SL if it moves at least this many pips (Anti-Spam)
  friday_exit_hour: 21              # Close all trades Friday at 21:00
  min_trade_duration_seconds: 240 # Scalping Policy: Min holder time 4 mins
  pending_order_expiry_hours: 4   # Cancel unfilled stop/limit orders after N hours
  symbol_risk_map:
    XAUUSD: 2.0
    GBPUSD: 2.0

strategy:
  ema_period_fast: 50
  ema_period_slow: 200
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  # RELAXED PARAMETERS (More Trades)
  wick_threshold_ratio: 0.25    # Was 0.30 - lower = more signals
  liquidity_lookback: 15        # Was 25 - shorter = more levels found
  rsi_buy_threshold: 70         # Was 55 - higher = less filtering
  rsi_sell_threshold: 30        # Was 35 - lower = less filtering
  sma_period: 40
  atr_multiplier: 1.5
  atr_multiplier_map:
    XAUUSD: 0.5  # Dramatically reduced to allow trading on small balance
    GBPUSD: 1.5  # Standard forex ATR


  entry_atr_multiplier: 0.1
  atr_period: 14
  sl_buffer_map:
    XAUUSD: 0.50
    US30: 5.0
    USTECH100: 5.0
    GBPUSD: 0.0005    # 5 pips for forex
    default: 0.50
  tp_mode: "dynamic"   # Options: "structured", "infinite", "dynamic", "fixed_rr"
  risk_reward_ratio: 3.0 # Core RR Target
  news_blocked_times: [] # Format: "2025-12-25 14:00"
  # SMC Filter (Order Block + FVG Confluence)
  smc_filter_enabled: false
  smc_min_confluence_score: 20  # 0=off, 20=light, 50=strict
  active_pairs:
    - { low: "H4", high: "D1", label: "SWING" }
    - { low: "H1", high: "H4", label: "DAY" }

  # Per-symbol strategy overrides (override global defaults above)
  symbol_overrides:
    GBPUSD:
      wick_threshold_ratio: 0.20  # Optimised for 6-months (+0.05 PnL, PF 1.76)
      liquidity_lookback: 10      # Tighter lookback for recent levels
      sma_period: 50              # Matches gold's trend speed
      risk_reward_ratio: 2.0      # Conservative RR for forex
      require_trend_alignment: true  # Keep strict trend
      rsi_confirmation: true         # Re-enable RSI
      rsi_buy_threshold: 60          # Allow buys up to 60 RSI (looser than 50)
      rsi_sell_threshold: 40         # Allow sells down to 40 RSI (looser than 50)
      # allowed_pairs removed to allow SWING + DAY

telegram:
  enabled: true
  enable_reports: false # Disable periodic performance reports
  report_interval_hours: 4 # Reduce spam (default was hourly)

  chat_id: ""
  token: ""
